plugins {
    id 'jacoco'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.boot' version '3.3.6'//Versión de componentes de spring boot
    id 'org.sonarqube' version '4.0.0.2929'
    id "org.owasp.dependencycheck" version "8.1.2"
    id 'com.github.ben-manes.versions' version '0.46.0'
    id 'java'
}

group = 'com.proyecto.servicio.empresa'
version = '1.0'

java{
    sourceCompatibility=17
    targetCompatibility=17
}

repositories {
    mavenCentral()
}


dependencies {
    // Spring Cloud
    implementation 'org.springframework.cloud:spring-cloud-config-client:4.1.4'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.4'

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Documentación OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

    // Base de datos y migraciones
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Seguridad JWT
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Mapeo (MapStruct)
    implementation 'org.mapstruct:mapstruct:1.6.3'

    // XML / JAXB (OpenFeign GestoPago)
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.3'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    implementation 'io.github.openfeign:feign-jaxb:12.5'

    // Soporte y herramientas de desarrollo (Lombok)
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Pruebas
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2:2.2.220'
    testCompileOnly 'org.projectlombok:lombok:1.18.32'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'
}

configurations.all {
    exclude group: "org.apache.logging.log4j", module: "log4j-api"
    exclude group: "org.apache.logging.log4j", module: "log4j-to-slf4j"
    exclude group: "log4j", module: "log4j"
}

test {
    useJUnitPlatform()
}

springBoot {
    buildInfo {
    }
}

sonarqube {
    properties {
        property "sonar.exclusions", "**/App.java,**/model/**,**/entity/**,**/enums/**,**/config/**,**/controller/**,**/service/configuracion/**"
    }
}
jacocoTestReport {
    reports {
        reports {
            xml.required=true
        }
    }
}

//ejecutar applicación dentro de contenedor
//sh gradlew clean build dockerImage dockerUp
/**
 * Genera imagen
 */
task dockerImage(type: Exec) {
    println 'CrearImagen'
    commandLine "docker", "build", "-t", "proyecto-core:0.1", "$projectDir"
}

/**
 * Ejecuta imagen
 */
task dockerUp(type: Exec) {
    println "Arranca imagen"
    commandLine "docker-compose", "--compatibility", "up"
}

dependencyCheck {
    formats = ["JSON", "HTML"]
}
# 1. CONFIGURACIÓN DE SPRING BOOT
spring.config.import=optional:configserver:,optional:file:.env[.properties]

# 2. CONEXIÓN A BASE DE DATOS LOCAL
spring.datasource.url=jdbc:postgresql://localhost:5432/PWA
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=false

# Render asigna PORT; localmente se conserva el puerto 8080.
server.port=${PORT:8080}

# JWT: configurar JWT_SECRET con una clave aleatoria Base64 de al menos 256 bits.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=900

# 3. CREDENCIALES API GESTOPAGO (SANDBOX)
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD}
gestopago.auth.api-key=${GESTOPAGO_API_KEY}

# Redis y caché
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.cache.redis.time-to-live=600000

# INTEGRACION DE PRODUCTOS GESTOPAGO
gestopago.products.url=${gestopago.auth.url}
gestopago.unidad=${GESTOPAGO_UNIDAD:083}
gestopago.crypto.secret-key=${GESTOPAGO_SECRET_KEY:HPo7OLqB4Fkk4E2yGOtwqw8H5fHR9kNx67OR4g4UdlA=}
gestopago.crypto.iv=${GESTOPAGO_IV:p5ldmBPdd/9pjC0bDC/nSg==}

spring.cloud.openfeign.client.config.gestoPagoProducts.connectTimeout=5000
spring.cloud.openfeign.client.config.gestoPagoProducts.readTimeout=10000
spring.cloud.openfeign.client.config.gestoPagoXmlProducts.connectTimeout=5000
spring.cloud.openfeign.client.config.gestoPagoXmlProducts.readTimeout=30000
spring.cloud.openfeign.client.config.gestoPagoTransaction.connectTimeout=5000
spring.cloud.openfeign.client.config.gestoPagoTransaction.readTimeout=62000